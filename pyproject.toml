[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-front-dynamics"
version = "0.1.0"
description = "Auditable MVP for wildfire front reconstruction from thermal imagery with leak-free provenance"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = [
    "wildfire",
    "remote-sensing",
    "thermal-imagery",
    "fire-front",
    "geospatial",
    "machine-learning",
    "provenance",
]
authors = [
    {name = "WildfireFrontDynamics Contributors"},
]
maintainers = [
    {name = "WildfireFrontDynamics Contributors"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = ["numpy>=2.0", "rasterio>=1.4", "affine", "shapely>=2.0", "pyproj>=3.6"]

[project.urls]
Homepage = "https://github.com/AlonsoAlviraa/WildfireFrontDynamics"
Repository = "https://github.com/AlonsoAlviraa/WildfireFrontDynamics"
Issues = "https://github.com/AlonsoAlviraa/WildfireFrontDynamics/issues"
Documentation = "https://github.com/AlonsoAlviraa/WildfireFrontDynamics/tree/main/docs"

[project.optional-dependencies]
ml = ["torch>=2.0", "scikit-learn>=1.3"]
cloud = ["tensorflow>=2.15"]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest-cov>=5.0",
    "coverage>=7.0",
]
viz = ["matplotlib>=3.7", "Pillow>=10.0"]
all = ["wildfire-front-dynamics[ml,cloud,dev,viz]"]

[project.scripts]
wildfire-front = "wildfire_front.cli:main"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::rasterio.errors.NotGeoreferencedWarning",
]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
# Collect both pytest-style Test* and legacy *Tests class names after
# unittest.TestCase → plain class migrations (pytest default is Test* only).
python_classes = ["Test*", "*Tests"]
markers = [
    "requires_weights: needs local .pt checkpoints under models/ (gitignored; see CONTRIBUTING)",
    "slow: high-volume property / Monte Carlo grids (nightly; excluded from default CI with -m 'not slow')",
]

# Coverage gate: start modest (~74% observed); raise gradually. CI also passes
# --cov-fail-under=60 explicitly so the gate is visible in the workflow.
[tool.coverage.report]
fail_under = 60
omit = ["*/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "kaggle_job/archive",
    "scripts/archive",
]

[tool.ruff.lint]
# Defaults + useful extras: bugs (B), comprehensions (C4), import order (IUP),
# naming (N), pyupgrade (UP), simplified (SIM).
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function call in default argument (Click common pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]   # assert False is fine in tests
"kaggle_job/*" = ["E402"]  # late imports are intentional in training scripts
"scripts/run_experiment_loop.py" = ["E402"]
"scripts/batch_process_fires.py" = ["E402"]  # sys.path manipulation before imports
"scripts/process_one_fire.py" = ["E402"]  # sys.path manipulation before imports
"scripts/generate_semireal_candidate.py" = ["E402"]
"scripts/run_data_validation_sprint.py" = ["E402"]
"scripts/verify_data_validation_milestone.py" = ["E402"]
"scripts/audit_dataset_candidate.py" = ["E402"]
"scripts/generate_geotiff_fixture.py" = ["E402"]
"scripts/run_mvp.cmd" = ["E402"]
"scripts/inventory_real_if_material.py" = ["E402"]
"scripts/materialize_lwir_masks.py" = ["E402"]
"scripts/prepare_real_if_geotiffs.py" = ["E402"]
"scripts/build_real_if_frame_manifest.py" = ["E402"]
"scripts/audit_real_data_speeds.py" = ["E402"]
"scripts/build_ext_if_pack.py" = ["E402"]  # sys.path + load sibling AND builder

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = "(kaggle_job/archive|scripts/archive)"

[[tool.mypy.overrides]]
module = ["tests.*"]
strict = false

[[tool.mypy.overrides]]
module = ["models.unet_model"]
disable_error_code = ["assignment", "arg-type", "return-value"]

[tool.setuptools.packages.find]
where = ["."]
include = ["wildfire_front*", "models*"]
