# Project-scoped MCP for WildfireFrontDynamics.

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
enabled = true

[mcp_servers.github.headers]
Authorization = "Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}"

[mcp_servers.kaggle]
command = "uvx"
args = ["kaggle-mcp-server"]
enabled = true

[mcp_servers.kaggle.env]
KAGGLE_API_TOKEN = "${KAGGLE_API_TOKEN}"