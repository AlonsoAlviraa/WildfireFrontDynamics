# CodeQL config for WildfireFrontDynamics
#
# product/path_sandbox.py is the intentional post-allowlist FS sink layer:
# every open/exists/makedirs there runs only after realpath+commonpath checks.
# CodeQL does not model that multi-step sanitizer, so we exclude path-injection
# alerts from that file while still analyzing all call sites that must route
# through it.
name: "wfd-codeql"
queries:
  - uses: security-extended

# Prefer query-filters over paths-ignore so the rest of the pack still runs
# on path_sandbox.py (e.g. other security queries) but path-injection is muted.
query-filters:
  - exclude:
      id: py/path-injection
      paths:
        - wildfire_front/product/path_sandbox.py
  - exclude:
      id: py/http-response-splitting
      paths:
        - wildfire_front/cli_app.py
