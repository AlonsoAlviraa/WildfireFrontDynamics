name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GDAL system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "rasterio>=1.4"
          pip install ".[dev]"

      - name: Lint with ruff
        run: ruff check wildfire_front tests

      - name: Run tests
        run: pytest -q

  ml-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GDAL system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install ML extras
        run: |
          python -m pip install --upgrade pip
          pip install "rasterio>=1.4"
          pip install ".[ml,dev]"

      - name: Smoke-test model import and forward
        run: |
          python - <<'PY'
          import torch
          from models.model import A3C_PerCellModel_LSTM
          m = A3C_PerCellModel_LSTM()
          seq = torch.randn(1, 3, 16, 30, 30)
          mask = torch.zeros(1, 30, 30)
          feats, value = m(seq, mask)
          assert feats.shape == (1, 256, 30, 30)
          assert value.shape == (1, 1)
          print("ML smoke test OK")
          PY