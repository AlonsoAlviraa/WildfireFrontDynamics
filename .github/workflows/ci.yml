name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write  # GHA cache for docker/build-push-action

jobs:
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.4" "mypy>=1.10"

      - name: Ruff lint
        run: ruff check wildfire_front tests scripts

      - name: Ruff format check
        run: ruff format --check wildfire_front tests

      - name: Mypy type-check (core, no heavy deps)
        run: mypy wildfire_front --ignore-missing-imports

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install GDAL system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "rasterio>=1.4"
          pip install ".[ml,viz,dev]"
          pip install pytest-cov

      - name: Run tests with coverage
        run: pytest --cov=wildfire_front --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  ml-smoke:
    name: ML smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install GDAL system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install ML extras
        run: |
          python -m pip install --upgrade pip
          pip install "rasterio>=1.4"
          pip install ".[ml,dev]"

      - name: Run ML tests (pipeline + meta-labeler + NDWS + spread + export + ensemble)
        run: pytest tests/test_ml_pipeline.py tests/test_meta_labeler.py tests/test_ndws_metrics.py tests/test_spread_predictor.py tests/test_export_torchscript.py tests/test_product_catalog.py tests/test_clm_eval_ensemble.py -v

      - name: Run ops/incident unit tests
        run: pytest tests/test_incident_watch.py tests/test_cli_report.py tests/test_emergency_products.py -v

      - name: Smoke-test model import and forward
        run: |
          python - <<'PY'
          import torch
          from models.model import A3C_PerCellModel_LSTM
          m = A3C_PerCellModel_LSTM()
          seq = torch.randn(1, 3, 16, 30, 30)
          mask = torch.zeros(1, 30, 30)
          feats, value = m(seq, mask)
          assert feats.shape == (1, 256, 30, 30)
          assert value.shape == (1, 1)
          print("ML smoke test OK")
          PY

  docker:
    name: Docker build (runtime + inference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: wildfire-front-dynamics:runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke import geospatial stack (runtime)
        run: |
          docker run --rm --entrypoint python wildfire-front-dynamics:runtime -c \
            "import shapely, pyproj, rasterio, numpy, affine, wildfire_front; print('runtime-deps-ok')"

      - name: Build inference image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: inference
          push: false
          load: true
          tags: wildfire-front-dynamics:inference
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke import inference stack (weights optional)
        run: |
          docker run --rm --entrypoint python wildfire-front-dynamics:inference -c \
            "import torch; import wildfire_front.ml.spread_predictor as s; print('inference-import-ok')"
          # .pt are gitignored — do not fail CI when absent; only report status
          if [ -f models/production/weights_v21_best.pt ] || [ -f models/production/spread_model_v21.pt ]; then
            echo "Local production weight artifacts present in build context"
          else
            echo "NOTE: no production .pt in context (expected on clean clone)."
            echo "Inject via bind-mount or place under models/production/ before docker build."
            echo "See CONTRIBUTING.md Model weights section."
          fi
